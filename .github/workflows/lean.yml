name: Lean CI

# Two lanes: the Lean build (developer convenience; the kernel check is the
# proof authority) and the release-surface checks (claim registry, paper
# links, citation metadata, scope, licences). Feature branches run through the
# pull-request event only, avoiding a duplicate build for the same commit.
# Main is protected with both jobs required, so every commit that reaches it has
# already passed them on its pull request and a push-triggered rerun would only
# repeat work. If branch protection is relaxed, restore push validation before
# landing anything directly.
on:
  pull_request:
  # Manual dispatch remains the explicit way to revalidate main, a tag, or any
  # other ref without a dummy commit.
  workflow_dispatch:
    inputs:
      scope:
        description: "Validation scope for an immutable release or diagnostic replay"
        required: true
        default: all
        type: choice
        options:
          - all
          - external-verification-only
          - release-surfaces-only

concurrency:
  group: lean-ci-${{ github.event.pull_request.number || github.ref }}
  # A newer PR head covers the complete base-to-head diff, so its predecessor
  # is redundant. Never cancel main runs: a later documentation-only push must
  # not cancel validation of an earlier direct Lean push.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Every direct Git, Python, Lake, and network command below inherits the same
# environment-neutral contract as the cache-warm worker. Step-local values
# (event selectors, archive coordinates, and pinned tool revisions) remain
# explicit at their point of use; they must not change the safety baseline.
env:
  GIT_CONFIG_NOSYSTEM: "1"
  GIT_CONFIG_GLOBAL: /tmp/plectis-ci-empty.gitconfig
  GIT_OPTIONAL_LOCKS: "0"
  GIT_NO_REPLACE_OBJECTS: "1"
  # Cleared, not omitted: a namespaced ref view or a shifted replace-ref
  # base would change what the pinned-history gates resolve, and the
  # environment contract requires both to be empty.
  GIT_NAMESPACE: ""
  GIT_REPLACE_REF_BASE: ""
  GIT_PAGER: cat
  GIT_TERMINAL_PROMPT: "0"
  GIT_ASKPASS: /bin/false
  GIT_TRACE2: ""
  GIT_TRACE2_EVENT: ""
  GIT_TRACE2_PERF: ""
  PYTHONHOME: ""
  PYTHONPATH: ""
  PYTHONSTARTUP: ""
  PYTHONUSERBASE: ""
  PYTHONBREAKPOINT: ""
  PYTHONWARNINGS: ""
  PYTHONOPTIMIZE: ""
  PATH: /usr/local/bin:/usr/bin:/bin
  LC_ALL: C.UTF-8
  LANG: C.UTF-8
  LANGUAGE: C.UTF-8
  PYTHONHASHSEED: "0"
  PYTHONNOUSERSITE: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"

jobs:
  change_scope:
    name: Classify pull-request scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      erdos1041_corpus_only: ${{ steps.scope.outputs.erdos1041_corpus_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: blob:none # retain history without eagerly transferring obsolete large blobs
          persist-credentials: false
      - name: Detect an exact Erdős 1041 research-corpus publication
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          corpus_only=false
          if [[ "$EVENT_NAME" == "pull_request" && -n "$PR_BASE_SHA" && -n "$PR_HEAD_SHA" ]]; then
            mapfile -t changed < <(git diff --name-only "$PR_BASE_SHA" "$PR_HEAD_SHA")
            if (( ${#changed[@]} > 0 )); then
              corpus_only=true
              for path in "${changed[@]}"; do
                if [[ "$path" != research_corpus/Erdos1041/* ]]; then
                  corpus_only=false
                  break
                fi
              done
            fi
          fi
          echo "erdos1041_corpus_only=$corpus_only" >> "$GITHUB_OUTPUT"
          echo "Erdős 1041 corpus-only publication: $corpus_only"

  build:
    needs: change_scope
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.scope == 'all' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # change gate compares the complete PR or push range
          filter: blob:none # retain history without eagerly transferring obsolete large blobs
          persist-credentials: false
      - name: Install the pinned Python runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.9"
      - name: Detect supported-root Lean changes
        id: lean-inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="$BEFORE_SHA"
          head="$GITHUB_SHA"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          fi

          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            changed=true
          # This pathspec also decides whether "Verify elaborated dependency
          # index" runs, so it has to cover every file
          # build_lean_dependency_index.CHECK_INPUT_FILES declares -- the two
          # docs/ projections included. Leaving docs/declaration_atlas.json out
          # was not theoretical: the index copies its source_fingerprint from
          # the atlas and query_corpus rejects the whole index when the two
          # disagree, and on 2026-08-30 four consecutive atlas-only commits
          # (e75afbb3, 53db1318, 0d188b6d, 1169acce) changed that fingerprint
          # with changed=false, so the verification step never ran and a
          # dependency index that no longer matched the tree shipped green.
          # scripts/test_lean_fast_build.py pins the coverage.
          elif git diff --quiet "$base" "$head" -- \
            Erdos249257.lean 'Erdos249257/**' \
            ErdosProblems.lean 'ErdosProblems/**' \
            'adapters/**' 'examples/**' 'residualbench/**' \
            lakefile.toml lakefile.lean lake-manifest.json lean-toolchain \
            docs/declaration_atlas.json \
            docs/generated_certificate_manifest.json \
            scripts/build_declaration_atlas.py \
            scripts/build_lean_dependency_index.py \
            scripts/export_lean_dependency_edges.lean \
            scripts/lean_fast_build.py \
            scripts/query_corpus.py; then
            changed=false
          else
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "Lean-affecting changes: $changed ($base..$head)"
      - name: Test pinned proof-environment lock
        run: python3 scripts/test_dependency_lock_contract.py
      - name: Test bounded build planner
        run: python3 scripts/test_lean_fast_build.py
      - name: Test dependency-bootstrap environment
        run: |
          python3 scripts/test_lean_dependency_environment.py
          python3 -O scripts/test_lean_dependency_environment.py
      - name: Test dependency-index verification cache
        run: python3 scripts/test_lean_dependency_index_cache.py
      - name: Restore project Lean cache
        if: steps.lean-inputs.outputs.changed == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # This top-level action saves after the later custom build has
          # populated project OLeans. Keep the historical lean-action key
          # shape so existing main-branch caches seed the optimized run.
          path: .lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}
      - name: Install pinned Lean toolchain
        if: steps.lean-inputs.outputs.changed == 'true'
        env:
          ELAN_ARCHIVE_URL: https://github.com/leanprover/elan/releases/download/v4.2.3/elan-x86_64-unknown-linux-gnu.tar.gz
          ELAN_ARCHIVE_SHA256: df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/elan-x86_64-unknown-linux-gnu.tar.gz"
          installer_dir="$RUNNER_TEMP/elan-installer"
          mkdir -p "$installer_dir"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$archive" "$ELAN_ARCHIVE_URL"
          printf '%s  %s\n' "$ELAN_ARCHIVE_SHA256" "$archive" | sha256sum --check -
          tar --extract --gzip --file "$archive" --directory "$installer_dir"
          "$installer_dir/elan-init" -y --default-toolchain none --no-modify-path
          "$HOME/.elan/bin/elan" toolchain install "$(tr -d '\r\n' < lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned dependency build artifacts
        if: steps.lean-inputs.outputs.changed == 'true'
        # Mathlib's own `cache` executable, run by the pinned Lake toolchain
        # rather than a third-party composite action. It fetches oleans only
        # for the dependency revisions already fixed in lake-manifest.json;
        # this repository's own Lean sources are still elaborated locally by
        # the pinned kernel, so proof authority is unchanged. Without it a
        # cold Actions cache must compile Mathlib from source, which cannot
        # finish inside the runner job ceiling.
        run: |
          set -euo pipefail
          lake exe cache get
      - name: Memory-bounded Lean build
        if: steps.lean-inputs.outputs.changed == 'true'
        # One wrapper owner drains the two public roots plus every supported
        # non-default consumer. It prebuilds with bounded fan-out.
        # The final serialized Lake checks remain the proof-authority check.
        # Raw follow-up builds would duplicate work outside the shared
        # validation key, so every supported target is named here instead.
        run: python3 scripts/lean_fast_build.py --jobs 2 --lake-staleness Erdos249257 ErdosProblems Examples FormalConjecturesAdapter FormalConjecturesVariants ResidualBench
      # actions/cache saves only when the job succeeds. A build that compiles
      # the whole tree and then fails the dependency-index check below threw
      # away the compiled oleans, so every rerun paid a cold build again.
      # Save the compiled tree as soon as the build step finishes, whatever
      # the later evidence checks decide.
      - name: Save project Lean cache after the build
        if: always() && steps.lean-inputs.outputs.changed == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.sha }}
      - name: Verify elaborated dependency index
        id: dependency-index
        if: steps.lean-inputs.outputs.changed == 'true'
        # The coordinated build above is the sole compilation owner. This
        # explicit full check exports that already-built environment and writes
        # its exact receipt into .lake; plain --check is always noncompiling.
        continue-on-error: true
        run: python3 scripts/build_lean_dependency_index.py --check --full-check
      # The tracked index can only be refreshed from an elaborated environment,
      # which is exactly what this job has just built. When the check finds the
      # tracked index stale, export the fresh one and publish it as a run
      # artifact so the operator can land it without a local full build. The
      # job still fails below: the artifact is evidence for a commit, not a
      # waiver of the check.
      - name: Export the fresh dependency index for the operator
        if: steps.dependency-index.outcome == 'failure'
        run: python3 scripts/build_lean_dependency_index.py
      - name: Upload the fresh dependency index
        if: steps.dependency-index.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lean-dependency-index-${{ github.sha }}
          path: |
            docs/lean_dependency_index.json
            docs/lean_dependency_index_check.json
          if-no-files-found: error
      - name: Fail on a stale dependency index
        if: steps.dependency-index.outcome == 'failure'
        run: |
          echo "the tracked dependency index is stale; download artifact lean-dependency-index-${{ github.sha }} and commit it" >&2
          exit 1
      - name: Record documentation-only build skip
        if: steps.lean-inputs.outputs.changed != 'true'
        run: echo "No Lean source or proof-environment input changed; compilation is unchanged."

  external-verification:
    needs: change_scope
    if: ${{ needs.change_scope.outputs.erdos1041_corpus_only != 'true' && (github.event_name != 'workflow_dispatch' || inputs.scope == 'all' || inputs.scope == 'external-verification-only') }}
    runs-on: ubuntu-24.04
    # Four isolated checks now run here: headline positive and mismatch, then
    # the focused #1049 positive and mismatch. Each retains its own 20 minute
    # ceiling, so the job ceiling must cover the full serial trust sequence.
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # A pull-request checkout otherwise resolves to GitHub's synthetic
          # merge commit. Comparator receipts are source-review artefacts, so
          # bind them to the contributor-visible head commit instead.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          filter: blob:none # retain history without eagerly transferring obsolete large blobs
          persist-credentials: false
      - name: Detect external-verification inputs
        id: external-inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            changed=true
          else
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
            if [[ -z "$base" || -z "$head" ]]; then
              changed=true
            elif git diff --quiet "$base" "$head" -- \
              Erdos249257.lean 'Erdos249257/**' \
              ErdosProblems.lean 'ErdosProblems/**' \
              ExternalVerification ExternalVerification1049 \
              ExternalVerification249TotientKernelBasis Solutions NegativeSolutions \
              ExternalVerification1041SolvedFamilies 'verification/**' \
              lakefile.toml lakefile.lean lake-manifest.json lean-toolchain \
              docs/claims.json docs/problem_index_source.json docs/problems.json \
              docs/EXTERNAL_VERIFICATION.md docs/COMPARATOR_1049_NUMERICAL_HEIGHT.md \
              docs/external_verification_packet.json \
              formalization.yaml \
              scripts/build_external_verification.py \
              scripts/run_external_verification.py \
              scripts/test_external_verification.py \
              scripts/test_external_verification_release.py \
              .github/workflows/lean.yml; then
              changed=false
            else
              changed=true
            fi
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "External-verification inputs changed: $changed"
      - name: Install the pinned Python runtime
        if: steps.external-inputs.outputs.changed == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.9"
      - name: Initialize failure-safe verification receipt
        if: steps.external-inputs.outputs.changed == 'true'
        run: |
          mkdir -p artifacts
          python3 scripts/run_external_verification.py --phase initialized || true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.external-inputs.outputs.changed == 'true'
        with:
          go-version: "1.24.12"
          cache: false
      - name: Install pinned Lean toolchain
        if: steps.external-inputs.outputs.changed == 'true'
        env:
          ELAN_ARCHIVE_URL: https://github.com/leanprover/elan/releases/download/v4.2.3/elan-x86_64-unknown-linux-gnu.tar.gz
          ELAN_ARCHIVE_SHA256: df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/elan-x86_64-unknown-linux-gnu.tar.gz"
          installer_dir="$RUNNER_TEMP/elan-installer"
          mkdir -p "$installer_dir"
          curl --fail --location --proto '=https' --tlsv1.2 --output "$archive" "$ELAN_ARCHIVE_URL"
          printf '%s  %s\n' "$ELAN_ARCHIVE_SHA256" "$archive" | sha256sum --check -
          tar --extract --gzip --file "$archive" --directory "$installer_dir"
          "$installer_dir/elan-init" -y --default-toolchain none --no-modify-path
          "$HOME/.elan/bin/elan" toolchain install "$(tr -d '\r\n' < lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Prepare trusted challenge inputs
        if: steps.external-inputs.outputs.changed == 'true'
        run: |
          set -euo pipefail
          lake exe cache get
          python3 scripts/test_external_verification.py
          python3 -O scripts/test_external_verification.py
          python3 scripts/test_external_verification_release.py
          python3 -O scripts/test_external_verification_release.py
          python3 scripts/test_erdos249_totient_kernel_comparator.py
          python3 -O scripts/test_erdos249_totient_kernel_comparator.py
      - name: Build pinned Comparator toolchain
        if: steps.external-inputs.outputs.changed == 'true'
        id: tools
        env:
          COMPARATOR_REV: 789279735fe44c1c05dc54bb9f46ba4d9b8c7611
          LEAN4EXPORT_REV: 6f4e21dd70c3c11d7fbd07d39e3192792c657448
          LANDRUN_REV: 811cfff51ceaf3d9843708aa6d22e9b84ccac8b4
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/leanprover/comparator.git "$RUNNER_TEMP/comparator"
          git -C "$RUNNER_TEMP/comparator" checkout --detach "$COMPARATOR_REV"
          test "$(git -C "$RUNNER_TEMP/comparator" rev-parse HEAD)" = "$COMPARATOR_REV"
          (cd "$RUNNER_TEMP/comparator" && lake build comparator)
          git clone --filter=blob:none https://github.com/leanprover/lean4export.git "$RUNNER_TEMP/lean4export"
          git -C "$RUNNER_TEMP/lean4export" checkout --detach "$LEAN4EXPORT_REV"
          test "$(git -C "$RUNNER_TEMP/lean4export" rev-parse HEAD)" = "$LEAN4EXPORT_REV"
          (cd "$RUNNER_TEMP/lean4export" && lake build lean4export)
          git clone --filter=blob:none https://github.com/zouuup/landrun.git "$RUNNER_TEMP/landrun-src"
          git -C "$RUNNER_TEMP/landrun-src" checkout --detach "$LANDRUN_REV"
          test "$(git -C "$RUNNER_TEMP/landrun-src" rev-parse HEAD)" = "$LANDRUN_REV"
          (cd "$RUNNER_TEMP/landrun-src" && go build -o "$RUNNER_TEMP/landrun" cmd/landrun/main.go)
          echo "comparator_rev=$COMPARATOR_REV" >> "$GITHUB_OUTPUT"
          echo "lean4export_rev=$LEAN4EXPORT_REV" >> "$GITHUB_OUTPUT"
          echo "landrun_rev=$LANDRUN_REV" >> "$GITHUB_OUTPUT"
          echo "comparator_lean_toolchain=$(tr -d '\r\n' < "$RUNNER_TEMP/comparator/lean-toolchain")" >> "$GITHUB_OUTPUT"
      - name: Run positive and adversarial Comparator checks
        if: steps.external-inputs.outputs.changed == 'true'
        id: comparator
        continue-on-error: true
        run: |
          set +e
          export COMPARATOR_LANDRUN="$RUNNER_TEMP/landrun"
          export COMPARATOR_LEAN4EXPORT="$RUNNER_TEMP/lean4export/.lake/build/bin/lean4export"
          comparator="$RUNNER_TEMP/comparator/.lake/build/bin/comparator"
          systemctl --user show-environment > systemd-user-preflight.log 2>&1
          if [[ $? -eq 0 ]]; then
            sandbox_mode=user-manager
          elif sudo -n systemctl show-environment > systemd-system-preflight.log 2>&1; then
            sandbox_mode=system-manager-nonprivileged-unit
          else
            sandbox_mode=unavailable
          fi
          echo "sandbox_mode=$sandbox_mode" >> "$GITHUB_OUTPUT"
          run_comparator() {
            config="$1"
            if [[ "$sandbox_mode" == user-manager ]]; then
              timeout 20m systemd-run --property=RestrictAddressFamilies=~AF_UNIX --user --pipe \
                -E PATH="$PATH" -E COMPARATOR_LANDRUN="$COMPARATOR_LANDRUN" \
                -E COMPARATOR_LEAN4EXPORT="$COMPARATOR_LEAN4EXPORT" \
                --working-directory="$(pwd)" -- lake env "$comparator" "$config"
            elif [[ "$sandbox_mode" == system-manager-nonprivileged-unit ]]; then
              timeout 20m sudo -n systemd-run --property=RestrictAddressFamilies=~AF_UNIX \
                --uid="$(id -un)" --gid="$(id -gn)" --pipe \
                -E PATH="$PATH" -E COMPARATOR_LANDRUN="$COMPARATOR_LANDRUN" \
                -E COMPARATOR_LEAN4EXPORT="$COMPARATOR_LEAN4EXPORT" \
                --working-directory="$(pwd)" -- lake env "$comparator" "$config"
            else
              printf '%s\n' "No usable systemd transient-unit manager; refusing an insecure fallback."
              return 125
            fi
          }
          run_comparator verification/comparator.json \
            > artifacts-positive.log 2>&1
          positive_exit=$?
          run_comparator verification/comparator-negative-mismatch.json \
            > artifacts-negative.log 2>&1
          negative_exit=$?
          run_comparator verification/comparator-1049-numerical-height.json \
            > artifacts-1049-positive.log 2>&1
          local_1049_positive_exit=$?
          run_comparator verification/comparator-1049-numerical-height-negative-mismatch.json \
            > artifacts-1049-negative.log 2>&1
          local_1049_negative_exit=$?
          run_comparator ExternalVerification249TotientKernelBasis/comparator.json \
            > artifacts-249-totient-kernel-positive.log 2>&1
          totient_kernel_positive_exit=$?
          run_comparator ExternalVerification249TotientKernelBasis/comparator-negative-mismatch.json \
            > artifacts-249-totient-kernel-negative.log 2>&1
          totient_kernel_negative_exit=$?
          echo "positive_exit=$positive_exit" >> "$GITHUB_OUTPUT"
          echo "negative_exit=$negative_exit" >> "$GITHUB_OUTPUT"
          echo "local_1049_positive_exit=$local_1049_positive_exit" >> "$GITHUB_OUTPUT"
          echo "local_1049_negative_exit=$local_1049_negative_exit" >> "$GITHUB_OUTPUT"
          echo "totient_kernel_positive_exit=$totient_kernel_positive_exit" >> "$GITHUB_OUTPUT"
          echo "totient_kernel_negative_exit=$totient_kernel_negative_exit" >> "$GITHUB_OUTPUT"
          cat artifacts-positive.log
          cat artifacts-negative.log
          cat artifacts-1049-positive.log
          cat artifacts-1049-negative.log
          cat artifacts-249-totient-kernel-positive.log
          cat artifacts-249-totient-kernel-negative.log
          exit 0
      - name: Write and enforce commit-bound verification receipt
        if: ${{ always() && !cancelled() && steps.external-inputs.outputs.changed == 'true' }}
        run: |
          positive_exit='${{ steps.comparator.outputs.positive_exit }}'
          negative_exit='${{ steps.comparator.outputs.negative_exit }}'
          local_1049_positive_exit='${{ steps.comparator.outputs.local_1049_positive_exit }}'
          local_1049_negative_exit='${{ steps.comparator.outputs.local_1049_negative_exit }}'
          [[ -n "$positive_exit" ]] || positive_exit=-999
          [[ -n "$negative_exit" ]] || negative_exit=-999
          [[ -n "$local_1049_positive_exit" ]] || local_1049_positive_exit=-999
          [[ -n "$local_1049_negative_exit" ]] || local_1049_negative_exit=-999
          python3 scripts/run_external_verification.py \
            --phase final \
            --expected-commit '${{ github.event.pull_request.head.sha || github.sha }}' \
            --positive-exit "$positive_exit" \
            --negative-exit "$negative_exit" \
            --positive-log artifacts-positive.log \
            --negative-log artifacts-negative.log \
            --local-1049-positive-exit "$local_1049_positive_exit" \
            --local-1049-negative-exit "$local_1049_negative_exit" \
            --local-1049-positive-log artifacts-1049-positive.log \
            --local-1049-negative-log artifacts-1049-negative.log \
            --comparator-rev '${{ steps.tools.outputs.comparator_rev }}' \
            --lean4export-rev '${{ steps.tools.outputs.lean4export_rev }}' \
            --landrun-rev '${{ steps.tools.outputs.landrun_rev }}' \
            --comparator-lean-toolchain '${{ steps.tools.outputs.comparator_lean_toolchain }}' \
            --sandbox-mode '${{ steps.comparator.outputs.sandbox_mode }}' \
            --comparator-bin "$RUNNER_TEMP/comparator/.lake/build/bin/comparator" \
            --lean4export-bin "$RUNNER_TEMP/lean4export/.lake/build/bin/lean4export" \
            --landrun-bin "$RUNNER_TEMP/landrun"
      - name: "Enforce the #1049 programme-local packet"
        if: steps.external-inputs.outputs.changed == 'true'
        run: |
          test '${{ steps.comparator.outputs.local_1049_positive_exit }}' = 0
          test '${{ steps.comparator.outputs.local_1049_negative_exit }}' != 0
          grep -q 'statement do not match' artifacts-1049-negative.log
      - name: "Enforce the dedicated #249 all-base totient-kernel packet"
        if: ${{ always() && !cancelled() && steps.external-inputs.outputs.changed == 'true' }}
        run: |
          positive_exit='${{ steps.comparator.outputs.totient_kernel_positive_exit }}'
          negative_exit='${{ steps.comparator.outputs.totient_kernel_negative_exit }}'
          [[ -n "$positive_exit" ]] || positive_exit=-999
          [[ -n "$negative_exit" ]] || negative_exit=-999
          python3 scripts/write_erdos249_totient_kernel_comparator_receipt.py \
            --expected-commit '${{ github.event.pull_request.head.sha || github.sha }}' \
            --positive-exit "$positive_exit" \
            --negative-exit "$negative_exit" \
            --positive-log artifacts-249-totient-kernel-positive.log \
            --negative-log artifacts-249-totient-kernel-negative.log \
            --comparator-rev '${{ steps.tools.outputs.comparator_rev }}' \
            --lean4export-rev '${{ steps.tools.outputs.lean4export_rev }}' \
            --landrun-rev '${{ steps.tools.outputs.landrun_rev }}' \
            --sandbox-mode '${{ steps.comparator.outputs.sandbox_mode }}' \
            --comparator-bin "$RUNNER_TEMP/comparator/.lake/build/bin/comparator" \
            --lean4export-bin "$RUNNER_TEMP/lean4export/.lake/build/bin/lean4export" \
            --landrun-bin "$RUNNER_TEMP/landrun"
      # This step used to be `lake build <module>.AxiomAudit`, which was a gate
      # that could not fail: `#print axioms` prints and never errors, nothing
      # parsed the output, and on a warm `.lake` the module is cached so the
      # build emitted no axiom lines at all.  A green check meant nothing.
      #
      # `lake env lean <file>` re-elaborates the audit source every run, so the
      # lines are always produced, and the three assertions below turn them
      # into an actual gate.  The empty-output assertion is the load-bearing
      # one: without it, any future change that stops producing audit lines
      # would silently pass both grep checks.
      # The two Comparator packets above build ExternalVerification and
      # ExternalVerification1049 as a side effect of checking them.  Nothing
      # checks ExternalVerification1041SolvedFamilies against a challenge, so
      # nothing built it, and `lake env lean` on its audit file failed with
      # "unknown module prefix" on every run since the library was published.
      # Build it explicitly so the audit below elaborates against real oleans.
      - name: Build the audited solved-families library
        if: steps.external-inputs.outputs.changed == 'true'
        run: python3 scripts/lean_fast_build.py --jobs 2 --lake-staleness ExternalVerification1041SolvedFamilies.Solution
      - name: Post-verification axiom audit (gated)
        if: steps.external-inputs.outputs.changed == 'true'
        run: |
          set -euo pipefail
          : > axiom-audit.log
          for src in ExternalVerification/AxiomAudit.lean \
                     ExternalVerification1049/AxiomAudit.lean \
                     ExternalVerification1041SolvedFamilies/AxiomAudit.lean; do
            printf '=== %s ===\n' "$src" >> axiom-audit.log
            lake env lean "$src" 2>&1 | tee -a axiom-audit.log
          done

          audited=$(grep -c 'depends on axioms' axiom-audit.log || true)
          if [[ "$audited" -eq 0 ]]; then
            echo "axiom audit produced no 'depends on axioms' lines; the gate did not run" >&2
            exit 1
          fi
          echo "axiom audit covered $audited declarations"

          if grep -q 'sorryAx' axiom-audit.log; then
            echo "axiom audit found sorryAx: a compared declaration is not proved" >&2
            grep -n 'sorryAx' axiom-audit.log >&2
            exit 1
          fi
          if grep -q 'ofReduceBool\|Lean.trustCompiler' axiom-audit.log; then
            echo "axiom audit found a native-reduction axiom (native_decide)" >&2
            grep -n 'ofReduceBool\|Lean.trustCompiler' axiom-audit.log >&2
            exit 1
          fi
      - name: Upload external-verification receipt
        if: ${{ always() && steps.external-inputs.outputs.changed == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: external-verification-receipt-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/external-verification-receipt.json
            artifacts/erdos249-totient-kernel-comparator-receipt.json
          if-no-files-found: error

  first-contact:
    # The published invitation, run the way a stranger runs it: clone it, no
    # Lean, no toolchain, no pinned interpreter. The fixed Linux jobs use the
    # pinned ubuntu-24.04 image; this matrix deliberately adds macOS and an
    # unpinned reader-host Ubuntu lane so reader portability remains visible.
    # The reader-facing surfaces are pure Python and the claim is that they
    # need nothing else; this is where that is tested rather than assumed.
    name: First contact without Lean (${{ matrix.os }})
    needs: change_scope
    if: ${{ needs.change_scope.outputs.erdos1041_corpus_only != 'true' && (github.event_name != 'workflow_dispatch' || inputs.scope == 'all' || inputs.scope == 'release-surfaces-only') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ["macos-latest", "ubuntu-latest"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # the pinned-history gates resolve the formal-source commit
          filter: blob:none # retain history without eagerly transferring obsolete large blobs
          persist-credentials: false
      - name: Report the interpreter a reader would actually use
        run: python3 -VV
      - name: Follow one claim to its source, its receipts, and its limit
        run: |
          python3 scripts/verify_claims.py --claim eb_full_support
          python3 scripts/verify_claims.py --verify-all
      - name: Navigate the corpus with no Lean build
        run: |
          python3 scripts/query_corpus.py --tour --format card
          python3 scripts/check_cold_clone_comprehension.py --quick
      # This test asserts that every provider adapter imports the compact entry
      # rather than the deep contract. It was written, it was correct, and no
      # lane ran it: not this workflow, not check_release.py, not any Makefile
      # target. It sat red on main while CLAUDE.md imported AGENTS.md, so Claude
      # Code opened a cold clone straight into the 31KB deep contract that the
      # compact entry exists to defer. First contact is what this job is for.
      - name: Every provider adapter routes to the compact entry
        run: python3 scripts/test_compact_agent_entry.py
      - name: Ordinary tasks route to complete clone-local skill cards
        run: python3 scripts/test_agent_entry.py

  shallow-clone-is-an-environment-problem:
    # `git clone --depth 1` truncates history, and the gates that read pinned
    # commits then report the formal-source commit as absent -- which reads to
    # a newcomer like a claim that does not hold. verify_claims exits 2 and
    # prints the remedy instead of exiting 1. That distinction is only worth
    # stating on the README if something checks it, and a job that cannot be
    # shown failing checks nothing, so this asserts the exact code.
    name: A truncated clone exits 2, never 1
    needs: change_scope
    if: ${{ needs.change_scope.outputs.erdos1041_corpus_only != 'true' && (github.event_name != 'workflow_dispatch' || inputs.scope == 'all' || inputs.scope == 'release-surfaces-only') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1 # deliberately truncated: this is the condition under test
          persist-credentials: false
      - name: The environment check names the remedy and exits 2
        run: |
          set +e
          output="$(python3 scripts/verify_claims.py 2>&1)"
          code=$?
          set -e
          printf '%s\n' "$output" | head -n 3
          echo "exit code: $code"
          test "$code" -eq 2
          printf '%s' "$output" | grep -q 'git fetch --unshallow'
      - name: Following one claim still works on a truncated clone
        run: |
          python3 scripts/verify_claims.py --claim eb_full_support
          python3 scripts/verify_claims.py --verify-all

  release-surfaces:
    needs: change_scope
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.scope == 'all' || inputs.scope == 'release-surfaces-only' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # corpus descriptor resolves the pinned proof-source tag
          filter: blob:none # retain history without eagerly transferring obsolete large blobs
          persist-credentials: false
      - name: Check content-addressed Erdős 1041 research corpus
        run: python3 scripts/check_erdos1041_research_corpus.py
      - name: Test public corpus privacy boundary
        run: |
          python3 scripts/test_erdos1041_research_corpus.py
          python3 -O scripts/test_erdos1041_research_corpus.py
      - name: Install the pinned Python runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.9"
      - name: Install metadata validators
        if: ${{ needs.change_scope.outputs.erdos1041_corpus_only != 'true' }}
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir --require-hashes --requirement requirements-release.txt

      - name: Check pinned release-validator dependency lock
        if: ${{ needs.change_scope.outputs.erdos1041_corpus_only != 'true' }}
        run: python3 scripts/test_dependency_lock_contract.py

      - name: Test Lean workflow command environment
        if: ${{ needs.change_scope.outputs.erdos1041_corpus_only != 'true' }}
        run: |
          python3 scripts/test_lean_workflow_environment.py
          python3 -O scripts/test_lean_workflow_environment.py

      - name: Check newcomer architecture guide
        if: ${{ needs.change_scope.outputs.erdos1041_corpus_only != 'true' }}
        run: |
          python3 scripts/check_architecture_guide.py
          python3 scripts/check_agent_navigation_paper.py
          python3 scripts/test_architecture_guide.py

      # Every check below is blocking, and every check below reports.  The
      # `!cancelled()` guard exists because release-surface failures are not
      # ordered by severity: a first-contact wording check runs before the
      # proof-trust guard, so a fail-fast job can report a missing README
      # sentence while silently never reaching a `native_decide` violation in
      # the checked source.  That is what happened between 2026-07-13 and
      # 2026-07-16.  Surfacing all failures at once weakens nothing; the job
      # still fails if any single check fails.
      - name: Cross-surface release checks (proof trust, claims, projections)
        if: ${{ !cancelled() && needs.change_scope.outputs.erdos1041_corpus_only != 'true' }}
        run: python3 scripts/check_release.py
      # Most committed `check_*.py` gates are reached transitively. In
      # particular, check_release runs the combined cold-clone
      # baseline-plus-adversarial program once; repeating the standalone
      # baseline here added no authority. test_check_release_ref imports the
      # release-ref wrapper, while the distinct checks below remain explicit.
      - name: Test the claim-following verb reports drift
        if: ${{ !cancelled() && needs.change_scope.outputs.erdos1041_corpus_only != 'true' }}
        run: python3 scripts/test_verify_claims.py
      - name: Test problem papers and source maps
        run: python3 scripts/test_problem_library.py
      - name: Publication contract
        if: ${{ !cancelled() && needs.change_scope.outputs.erdos1041_corpus_only != 'true' }}
        run: python3 scripts/check_publication_contract.py
      - name: Problem-specific frontier checks
        if: ${{ !cancelled() && needs.change_scope.outputs.erdos1041_corpus_only != 'true' }}
        run: |
          python3 scripts/check_erdos269_dyadic_windows.py
          python3 scripts/check_farey_denominator_scaling.py
          python3 scripts/check_formal_conjectures_crosswalk.py
          # The crosswalk checker decides what the crosswalk may claim, and its
          # own unit tests are what decide that the checker still refuses an
          # unevidenced claim.  They were never run here, so a checker that had
          # stopped refusing anything would have gone unnoticed.
          python3 -m unittest scripts.test_formal_conjectures_crosswalk -v
          # The residual evaluator issues kernel-backed vetoes, so what needs
          # guarding is the classification itself: that restatement is judged
          # per residual in both directions, that nothing proved stays an
          # abstention, and that each tactic gets its own declaration because
          # `first` does not recover past a nested elaboration error.  These
          # checks need no Lean.
          python3 scripts/test_residual_evaluator.py
      # GitHub renders markdown in a 1012px column and a table has no wrapping
      # escape, so a long declaration name in a cell pushes the table past the
      # column and the reader gets a horizontal scrollbar with every other
      # column squashed.  `<wbr>` and `style` are both stripped by GitHub's
      # sanitiser, so the only fix is structural and the only guard is a check.
      # Content-addressed exact-copy corpus files remain report-only when their
      # bytes match the manifest: changing those tables would break provenance,
      # and the corpus-integrity step above is their authoritative gate.
      - name: Markdown tables fit the rendered column
        if: ${{ !cancelled() && needs.change_scope.outputs.erdos1041_corpus_only != 'true' }}
        run: python3 scripts/check_markdown_table_render.py --fail-on overflow .
      # The freshness comparison above is only meaningful if a projection is a
      # pure function of the committed tree. This test exports HEAD without Git
      # metadata, injects hostile ambient Git/Python settings, and requires every
      # builder in the bounded probe to accept committed bytes without rewriting them.
      # A builder that relies on checkout-local refs therefore fails regardless
      # of whether this job started from `main` or a pull-request topic branch.
      - name: Test projections do not depend on the checkout shape
        if: ${{ !cancelled() && needs.change_scope.outputs.erdos1041_corpus_only != 'true' }}
        run: python3 scripts/test_projection_checkout_independence.py
      - name: Test immutable release source resolution
        if: ${{ !cancelled() && needs.change_scope.outputs.erdos1041_corpus_only != 'true' }}
        run: python3 scripts/test_release_source_identity.py
      - name: Test source-current expert handoffs
        if: ${{ !cancelled() && needs.change_scope.outputs.erdos1041_corpus_only != 'true' }}
        run: |
          python3 scripts/test_expert_handoffs.py
          python3 -O scripts/test_expert_handoffs.py
      - name: Test clean committed-snapshot release wrapper
        if: ${{ !cancelled() && needs.change_scope.outputs.erdos1041_corpus_only != 'true' }}
        run: python3 scripts/test_check_release_ref.py
      - name: Test scope source-identity boundary
        if: ${{ !cancelled() && needs.change_scope.outputs.erdos1041_corpus_only != 'true' }}
        run: python3 scripts/test_scope_source_identity.py
      - name: Test public-artifact boundary
        # This is a repository-wide public membrane, so it must still run when
        # the changed files are confined to the public #1041 corpus. The
        # corpus integrity check above remains the corpus-specific gate; this
        # step prevents a corpus-only PR from bypassing the release's
        # provenance, open-problem, and portfolio-visibility contract.
        if: ${{ !cancelled() }}
        run: python3 scripts/test_public_artifact_boundary.py
      - name: Test supported root-import closure
        if: ${{ !cancelled() && needs.change_scope.outputs.erdos1041_corpus_only != 'true' }}
        run: python3 scripts/test_root_import_closure.py
      - name: Test downstream example claim boundary
        if: ${{ !cancelled() && needs.change_scope.outputs.erdos1041_corpus_only != 'true' }}
        run: python3 scripts/test_downstream_example_contract.py
      - name: Test adversarial methodology transitions
        if: ${{ !cancelled() && needs.change_scope.outputs.erdos1041_corpus_only != 'true' }}
        run: python3 scripts/test_methodology_contract.py
      - name: Test publication artifact mutations
        if: ${{ !cancelled() && needs.change_scope.outputs.erdos1041_corpus_only != 'true' }}
        run: python3 scripts/test_publication_artifact_contract.py
      # The artifact digests above are only worth anything while the route that
      # refreshes them stays honest. A restamp that stamped a revised .tex onto
      # a PDF nobody rebuilt would make the registry certify the mismatch it
      # exists to catch, so the refusal is tested, not assumed.
      - name: Test publication digest restamp refusals
        if: ${{ !cancelled() && needs.change_scope.outputs.erdos1041_corpus_only != 'true' }}
        run: python3 scripts/test_publication_contract_restamp.py
      - name: Test exact claim packet boundaries
        if: ${{ !cancelled() && needs.change_scope.outputs.erdos1041_corpus_only != 'true' }}
        run: python3 scripts/test_claim_packet_boundaries.py
      - name: Test publication evidence time axis
        if: ${{ !cancelled() && needs.change_scope.outputs.erdos1041_corpus_only != 'true' }}
        run: python3 scripts/test_publication_evidence_time_axis.py
      # The clone-local paper corpus is generated from the private system
      # repository, so no builder here can refresh it and nothing above notices
      # when it falls behind. It shipped stale from 2026-07-21: the generated
      # full text still omitted the generative-AI disclosure that both
      # manuscripts and both PDFs carried, which is the one drift a reader must
      # not meet. The checker ships in the corpus it guards; run it.
      - name: Test clone-local paper corpus is current
        if: ${{ !cancelled() && needs.change_scope.outputs.erdos1041_corpus_only != 'true' }}
        run: python3 docs/papers/check_paper_corpus.py
      # Nothing in this corpus has been externally reviewed and nothing carries
      # an archival identifier. A field that said otherwise would be read as a
      # credential, so the corpus is checked for that claim directly.
      - name: Test paper corpus claims no review or identifier it lacks
        if: ${{ !cancelled() && needs.change_scope.outputs.erdos1041_corpus_only != 'true' }}
        run: python3 docs/papers/check_publication_taxonomy.py
      - name: Test publication taxonomy is the current projection
        if: ${{ !cancelled() && needs.change_scope.outputs.erdos1041_corpus_only != 'true' }}
        run: python3 docs/papers/build_publication_taxonomy.py --check
      - name: Test ordinary-language status questions
        if: ${{ !cancelled() && needs.change_scope.outputs.erdos1041_corpus_only != 'true' }}
        run: python3 scripts/test_status_question_search.py
      - name: Validate CITATION.cff
        if: ${{ !cancelled() && needs.change_scope.outputs.erdos1041_corpus_only != 'true' }}
        run: python3 scripts/check_metadata.py
      - name: Test citation release identity
        if: ${{ !cancelled() && needs.change_scope.outputs.erdos1041_corpus_only != 'true' }}
        run: python3 scripts/test_citation_identity_contract.py
      - name: REUSE licensing lint
        if: ${{ !cancelled() && needs.change_scope.outputs.erdos1041_corpus_only != 'true' }}
        run: reuse lint
      - name: Test semantic licence map
        if: ${{ !cancelled() && needs.change_scope.outputs.erdos1041_corpus_only != 'true' }}
        run: python3 scripts/test_license_map_contract.py
